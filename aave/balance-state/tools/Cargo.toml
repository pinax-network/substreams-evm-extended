[package]
name = "aave-balance-state-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Offline replay of the Aave balance-state map over captured Extended blocks with conformance checks"

# Host tools are intentionally empty on WASM.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
num-bigint = "0.4"
serde_json = "1"
sha2 = "0.10"
aave-balance-state = { path = ".." }
conformance = { path = "../../../conformance" }
proto = { path = "../../../proto" }
prost = { workspace = true }
substreams-ethereum = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
