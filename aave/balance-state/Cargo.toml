[package]
name = "aave-balance-state"
description = "RPC-free Aave V3 aToken holder basis and reserve state from Extended blocks (evm.balance_state.v1)"
edition = { workspace = true }
version = "0.2.0"
license = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = { workspace = true }
substreams-ethereum = { workspace = true }
proto = { path = "../../proto" }
evm-persist = { path = "../../common/persist" }
evm-epochs = { path = "../../common/epochs" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
tiny-keccak = { version = "2.0", features = ["keccak"] }

[dev-dependencies]
buffa = { workspace = true }
buffa-types = { workspace = true }
