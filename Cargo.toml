[workspace]
members = [
  "proto",
  "common/persist",
  "common/epochs",
  "common/retention",
  "erc20/balances",
  "erc20/balances/tools",
  "erc20/events",
  "native/balances",
  "native/balances/tools",
  "aave/actions",
  "aave/actions/tools",
  "aave/balance-state",
  "aave/balance-state/tools",
  "evm/executions",
  "evm/executions/tools",
  "evm-balances",
  "evm-balances/common",
  "evm-balances/tools",
  "dex/pool-state",
  "compound-v2/balance-state",
  "compound-v3/balance-state",
  "lido/balance-state",
  "erc4626/balance-state",
  "erc4626/balance-state/tools",
  "conformance",
]
resolver = "2"
exclude = ["tools/scratch-scan"]

[workspace.package]
description = "EVM Substreams using Firehose Extended blocks"
edition = "2021"
version = "0.0.0"
license = "Apache-2.0"

[workspace.dependencies]
substreams = "0.7.0"
substreams-abis = { git = "https://github.com/pinax-network/substreams-abis.git", tag = "v1.5.0" }
substreams-ethereum = "0.11.1"
# Only the legacy `evm-balances` db_out patch uses this; same version as substreams-evm.
substreams-database-change = "3.0.0"
prost = "0.13"
prost-types = "0.13"

[profile.release]
lto = true

# evm-balances-tools tests interpret packaged WASM. Unoptimized wasmi is minutes
# slower, and its tail-call dispatch needs release-like codegen to keep the
# host stack flat.
[profile.dev.package.wasmi]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.wasmi_core]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.wasmi_ir]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.wasmi_collections]
opt-level = 3
debug-assertions = false
overflow-checks = false
