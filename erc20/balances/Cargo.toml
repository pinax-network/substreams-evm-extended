[package]
name = "erc20-balances"
description = "Experimental RPC-free ERC-20 balances inferred from Extended block storage, with the shared balances protobuf"
edition = { workspace = true }
version = "0.4.0"
license = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = { workspace = true }
substreams-ethereum = { workspace = true }
proto = { path = "../../proto" }
hex = "0.4"
tiny-keccak = { version = "2.0", features = ["keccak"] }

[dev-dependencies]
buffa = { workspace = true }
serde_json = "1"
