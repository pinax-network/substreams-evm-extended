[package]
name = "evm-retention"
description = "Host-side retained holder state for evm.balances.v1 and evm.balance_state.v1 consumers: initialization origins, unknown vs known-zero, continuity, undo and separate completeness reporting"
edition = { workspace = true }
version = "0.1.0"
license = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
proto = { path = "../../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hex = "0.4"
