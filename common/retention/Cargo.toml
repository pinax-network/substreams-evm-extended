[package]
name = "evm-retention"
description = "Host-side retained holder state for evm.balances.v1 and evm.balance_state.v1 consumers: initialization origins, unknown vs known-zero, continuity, undo and separate completeness reporting"
edition = { workspace = true }
version = "0.1.0"
license = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
proto = { path = "../../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hex = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
aave-balance-state = { path = "../../aave/balance-state" }
compound-v2-balance-state = { path = "../../compound-v2/balance-state" }
compound-v3-balance-state = { path = "../../compound-v3/balance-state" }
lido-balance-state = { path = "../../lido/balance-state" }
erc4626-balance-state = { path = "../../erc4626/balance-state" }
substreams-ethereum = { workspace = true }
prost-types = { workspace = true }
