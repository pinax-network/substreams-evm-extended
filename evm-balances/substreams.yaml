specVersion: v0.1.0
package:
  name: evm_balances
  version: v0.6.0
  url: https://github.com/pinax-network/substreams-evm-extended
  image: ../assets/pinax-icon-gradient-512px.png
  description: ERC-20 and native balances from Extended blocks into the substreams-evm ClickHouse tables.

imports:
  # Pinned descriptors use the CLI's canonical SQL path and the emitted
  # database-change 5.0.0 schema. See proto/SOURCES.md.
  sink_types: ../spkg/evm-balances-sink-protodefs-v0.1.0.spkg

  # Both balance maps take only an Extended block; neither has params.
  native_balances: ../native/balances/substreams.yaml
  erc20_balances: ../erc20/balances/substreams.yaml

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/evm_balances.wasm

modules:
  - name: db_out
    kind: map
    inputs:
      - source: sf.substreams.v1.Clock
      - map: native_balances:map_events
      - map: erc20_balances:map_events
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

sink:
  module: db_out
  type: sf.substreams.sink.sql.v1.Service
  config:
    schema: "./clickhouse/schema.sql" # generated by `make schema`
    engine: clickhouse
    postgraphile_frontend:
      enabled: false

# Default routing only; this does not qualify a network or its producer.
network: bsc
