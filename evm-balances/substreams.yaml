specVersion: v0.1.0
package:
  name: evm_balances
  version: v0.4.0
  url: https://github.com/pinax-network/substreams-evm-extended
  description: ERC-20 and native balances from Extended blocks into the substreams-evm ClickHouse tables.

imports:
  # SQL sink protobufs, byte-identical to substreams-evm's copies.
  database_changes: ../spkg/substreams-database-change-v2.0.0.spkg
  sql: ../spkg/substreams-sink-sql-protodefs-v1.0.7.spkg

  # Local manifests. Their qualified producer versions per network come from
  # native/balances' own `networks:`; never set imported params here.
  native_balances: ../native/balances/substreams.yaml
  erc20_balances: ../erc20/balances/substreams.yaml

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/evm_balances.wasm

modules:
  - name: db_out
    kind: map
    inputs:
      - source: sf.substreams.v1.Clock
      - map: native_balances:map_events
      - map: erc20_balances:map_events
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

sink:
  module: db_out
  type: sf.substreams.sink.sql.v1.Service
  config:
    schema: "./clickhouse/schema.sql" # generated by `make schema`
    engine: clickhouse
    postgraphile_frontend:
      enabled: false

# Must equal native/balances' default network: the CLI resolves an import under
# its own default network unless --network is passed.
network: bsc
