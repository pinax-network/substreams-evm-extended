[package]
name = "evm-balances-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Differential check of the ported legacy db_out against the deployed substreams-evm WASM"

# Host tools are intentionally empty on WASM; the workspace also checks every
# member for wasm32-unknown-unknown. None of these dependencies enter ingestion.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
prost = { workspace = true }
prost-types = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
substreams = { workspace = true }
substreams-ethereum = { workspace = true }
substreams-database-change = { workspace = true }
native-balances = { path = "../../native/balances" }
erc20-balances = { path = "../../erc20/balances" }
proto = { path = "../../proto" }
wasmi = { version = "2", default-features = false, features = ["stable", "std", "validate", "auto-dispatch"] }
