[package]
name = "conformance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Exact integer reference models for time-dependent protocol balances (host-only)"

[lib]
crate-type = ["rlib"]

# Reference arithmetic stays outside the WASM ingestion path.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
evm-retention = { path = "../common/retention" }
proto = { path = "../proto" }
tiny-keccak = { version = "2.0", features = ["keccak"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
aave-balance-state = { path = "../aave/balance-state" }
erc4626-balance-state = { path = "../erc4626/balance-state" }
lido-balance-state = { path = "../lido/balance-state" }
compound-v2-balance-state = { path = "../compound-v2/balance-state" }
compound-v3-balance-state = { path = "../compound-v3/balance-state" }
substreams-ethereum = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
hex = "0.4"
serde_json = "1"
