syntax = "proto3";

// evm.balance_state.v1: versioned holder-basis and global balance-state facts
// for tokens whose `balanceOf` is a function of (holder basis, shared protocol
// state, block clock). Companion to `evm.balances.v1`, which stays untouched:
// `Balance.amount` there is `balanceOf(account)`; nothing here replaces it.
//
// Emitted by small per-protocol packages (aave/balance-state,
// compound-v2/balance-state, compound-v3/balance-state, lido/balance-state,
// erc4626/balance-state, arc/balance-state), each with exactly one RPC-free
// `map_events` over an Extended `sf.ethereum.type.v2.Block`.
//
// Contract rules:
// * Every top-level `repeated` field of `Events` is one table in the native
//   Substreams ClickHouse sink. Rows are flat: no nested messages, repeated
//   fields, `oneof` or `optional` inside a row. The sink stores `bytes` and
//   `string` as `String`, so presence is carried by explicit enums and by the
//   convention that an empty decimal string means "not carried" while "0" is
//   an observed zero.
// * Exact integers are decimal strings (uint256 / int256 range, sign kept).
//   Addresses, hashes, slots and raw storage words are `bytes`. No floats.
// * Only persisted effects produce rows (`common/persist` rules). A reverted
//   frame or a failed transaction's non-persisted write never becomes a row.
//   A persisted write the bound model cannot explain fails the block.
// * Rows carry no finality. Forks arrive through the stream's
//   `BlockUndoSignal` (`last_valid_block`, `last_valid_cursor`); every row
//   above that block is discarded by the consumer. `final_blocks_only`
//   suppresses undo signals.
// * Absence is never zero. A holder or field without a row since the
//   consumer's checkpoint is missing/uninitialized. Initialization, exact
//   checkpoints, holder coverage and rollback are owned by issue #7; this
//   schema defines no bootstrap of its own.
// * Every enum has `*_UNSPECIFIED = 0`, never emitted. A consumer that reads an
//   enum number it does not know refuses to evaluate the row.
package evm.balance_state.v1;

// One `Events` per delivered block. Order inside each list is deterministic
// (sort keys are given per message) because the sink's `_row_id_` is the
// element index.
message Events {
  // Exactly one row per delivered block, including blocks without any other
  // row, so the clock is explicit rather than inferred from nonempty output.
  repeated BlockClock clocks = 1;
  // Model epoch lifecycle: BOUND, REAFFIRMED, INVALIDATED, SUSPENDED.
  repeated ModelEpoch epochs = 2;
  // Dependency edges of a BOUND or REAFFIRMED epoch.
  repeated Dependency dependencies = 3;
  // Same-balance identity aliases (Arc native USDC and its ERC-20 view).
  repeated AssetAlias aliases = 4;
  // Holder basis facts: scaled balances, shares, signed principal.
  repeated HolderBasis holder_basis = 5;
  // Shared global state facts: indices, rates, clocks, totals, constants,
  // cross-contract inputs.
  repeated GlobalState global_state = 6;
}

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

// Balance model family. `ModelEpoch.model_id` names the exact formula and
// rounding chain inside a family; the executable definition is the Rust
// conformance model of issue #16.
enum ModelFamily {
  MODEL_FAMILY_UNSPECIFIED = 0;
  // Aave V3 aToken: scaled balance x reserve normalized income (#13).
  MODEL_FAMILY_AAVE_V3_ATOKEN = 1;
  // Compound v2 cToken shares x exchange-rate inputs (#14).
  MODEL_FAMILY_COMPOUND_V2_CTOKEN = 2;
  // Compound III Comet signed base principal x base supply index (#15).
  MODEL_FAMILY_COMPOUND_V3_COMET = 3;
  // Lido stETH shares x totalPooledEther / totalShares (#23).
  MODEL_FAMILY_LIDO_STETH = 4;
  // ERC-4626 shares with an implementation-bound conversion (#24).
  MODEL_FAMILY_ERC4626_VAULT = 5;
  // Same-balance alias declaration only (Arc); no holder or global rows.
  MODEL_FAMILY_ASSET_ALIAS = 6;
}

// What kind of number a holder basis is. It decides the sign rule and, with
// the epoch's scale and rounding, the conversion to an observable balance.
enum BasisKind {
  BASIS_KIND_UNSPECIFIED = 0;
  // Unsigned amount multiplied by a global index and divided by the epoch
  // `basis_scale` (Aave V3 scaled balance, low 120 bits since v3.4).
  BASIS_KIND_SCALED_BALANCE = 1;
  // Unsigned share count converted through a ratio of global totals (cToken
  // `accountTokens`, stETH `shares`, ERC-4626 shares, Maker Pot `pie`).
  BASIS_KIND_SHARES = 2;
  // Signed principal (Comet `UserBasic.principal`, int104). Negative values
  // are borrow debt and never an ERC-20 supply balance; `value` keeps the
  // sign and is never clamped.
  BASIS_KIND_SIGNED_PRINCIPAL = 3;
  // Unsigned scaled debt basis (Aave variable debt). Deferred scope; listed so
  // debt can never be mislabeled as a supply basis.
  BASIS_KIND_SCALED_DEBT = 4;
}

// How the value in a row was established.
enum Observation {
  OBSERVATION_UNSPECIFIED = 0;
  // A persisted storage or balance write observed in this block. The row
  // states this one field only; it is never a complete snapshot of anything
  // else.
  OBSERVATION_OBSERVED_WRITE = 1;
  // Decoded from a persisted log that restates a value in full (Lido
  // `TokenRebased` post-report totals).
  OBSERVATION_OBSERVED_LOG = 2;
  // A value bound at qualification rather than read from this block: a
  // source constant, a code immutable pinned to a code hash, a deployment
  // invariant, or a caller parameter echoed for audit. The map checks the
  // pinned identity whenever the block carries a code change or pointer write.
  OBSERVATION_QUALIFIED_CONSTANT = 3;
  // Computed by the map as a pure function of rows of the SAME block. Emitted
  // only when every input was observed in this block; a map holds no state
  // across blocks. Inputs are always emitted as their own rows. A DERIVED row
  // is valid at its own block only and is never carried forward: evaluating
  // a later clock re-derives it from the latest input rows.
  OBSERVATION_DERIVED = 4;
}

// Whether a row is an intra-block change boundary, the end-of-block value, or
// a declaration with no write of its own.
enum Boundary {
  BOUNDARY_UNSPECIFIED = 0;
  // One persisted write at `ordinal`; `change_count` is 1. Emitted only when
  // the package parameter `emit_intermediate_changes` is true.
  BOUNDARY_CHANGE = 1;
  // Value after the last persisted write of the block, reduced over every
  // write of the key in execution order. `previous_value` is the value before
  // the first write, `first_ordinal` its ordinal, `ordinal` the last write's
  // ordinal. Always emitted for every key written in the block; matches the
  // end-of-block semantics of `evm.balances.v1`.
  BOUNDARY_END_OF_BLOCK = 2;
  // A qualified constant or parameter row; `ordinal` is the epoch boundary
  // ordinal.
  BOUNDARY_DECLARATION = 3;
}

// Execution scope of the persisted effect. Rows outside TRANSACTION scope have
// an empty `transaction_hash`; `transaction_index` and `call_index` are then
// meaningless.
enum Scope {
  SCOPE_UNSPECIFIED = 0;
  // A call with `state_reverted == false` inside a SUCCEEDED transaction.
  SCOPE_TRANSACTION = 1;
  // `Block.system_calls[]` with `state_reverted == false`; `call_index` is
  // the system call index.
  SCOPE_SYSTEM_CALL = 2;
  // `Block.balance_changes` / `Block.code_changes` records.
  SCOPE_BLOCK = 3;
  // Declared at an epoch boundary or heartbeat; no persisted write.
  SCOPE_EPOCH = 4;
}

// Lifecycle of a (market, epoch) model binding.
enum EpochEventKind {
  EPOCH_EVENT_KIND_UNSPECIFIED = 0;
  // Emitted once at the activation block with the full binding.
  EPOCH_EVENT_KIND_BOUND = 1;
  // Full binding restated every `epoch_heartbeat_blocks` so a consumer that
  // joins mid-stream recovers it without a competing bootstrap mechanism.
  // A map holds no state across blocks, so a REAFFIRMED row restates the
  // configured binding and its constants; it never attests that the epoch
  // was not INVALIDATED since activation and never resumes it. A consumer
  // joining mid-stream reads the epoch's stored rows since activation first.
  EPOCH_EVENT_KIND_REAFFIRMED = 2;
  // The previous epoch ended at (block, ordinal) for `reason`, with the
  // on-chain evidence cited and verified against the block. Immediately
  // followed by the BOUND row of the next epoch, or by SUSPENDED.
  EPOCH_EVENT_KIND_INVALIDATED = 3;
  // The market has no qualified model from here on (unsupported model).
  // Declared by parameters, never inferred. Retained state for the market
  // must not be evaluated past this point. A live write the bound layout
  // cannot describe is not a row: it fails the block.
  EPOCH_EVENT_KIND_SUSPENDED = 4;
}

// Why an epoch ended.
enum InvalidationReason {
  INVALIDATION_REASON_UNSPECIFIED = 0;
  // Persisted write to the market's implementation pointer slot.
  INVALIDATION_REASON_IMPLEMENTATION_POINTER_WRITE = 1;
  // Persisted `CodeChange` on the market itself.
  INVALIDATION_REASON_CODE_CHANGE = 2;
  // Persisted `CodeChange` on a dependency contract.
  INVALIDATION_REASON_DEPENDENCY_CODE_CHANGE = 3;
  // Persisted write to a dependency's pointer slot (beacon, locator, pool).
  INVALIDATION_REASON_DEPENDENCY_POINTER_WRITE = 4;
  // Persisted write to the slot holding a rate-model address, or new rate
  // immutables through a new implementation.
  INVALIDATION_REASON_RATE_MODEL_CHANGE = 5;
  // Persisted write to a contract-version slot (Lido `contractVersion`).
  INVALIDATION_REASON_CONTRACT_VERSION_SET = 6;
  // A qualified storage-layout migration (Lido totalShares slot move).
  INVALIDATION_REASON_STORAGE_MIGRATION = 7;
  // Operator-declared boundary without an on-chain trigger; evidence empty.
  INVALIDATION_REASON_PARAMETER_REBIND = 8;
  // SUSPENDED only: the era starting here was never qualified.
  INVALIDATION_REASON_UNQUALIFIED_ERA = 9;
}

// Role of a dependency edge in the evaluation graph.
enum DependencyRole {
  DEPENDENCY_ROLE_UNSPECIFIED = 0;
  // Logic contract executing behind the market proxy.
  DEPENDENCY_ROLE_IMPLEMENTATION = 1;
  // Beacon or kernel resolving the implementation.
  DEPENDENCY_ROLE_BEACON = 2;
  // Admin allowed to move the pointer.
  DEPENDENCY_ROLE_PROXY_ADMIN = 3;
  // Pool or core contract storing the shared index or rate (Aave Pool).
  DEPENDENCY_ROLE_POOL = 4;
  // Underlying asset whose storage is a cross-contract input (USDC for
  // cUSDC cash) or the asset a vault converts into.
  DEPENDENCY_ROLE_UNDERLYING = 5;
  // Interest-rate model contract (Compound v2 JumpRateModelV2).
  DEPENDENCY_ROLE_INTEREST_RATE_MODEL = 6;
  // External rate accumulator (Maker Pot for sDAI and cDAI).
  DEPENDENCY_ROLE_RATE_ACCUMULATOR = 7;
  // Contract authorized to write report-driven state (Lido Accounting).
  DEPENDENCY_ROLE_ACCOUNTING = 8;
  // Asset wrapped by a vault (aToken wrapped by a static aToken).
  DEPENDENCY_ROLE_WRAPPED_ASSET = 9;
}

// How a dependency identity is bound and checked.
enum BindingKind {
  BINDING_KIND_UNSPECIFIED = 0;
  // Runtime code hash pinned; any persisted `CodeChange` invalidates.
  BINDING_KIND_CODE_HASH = 1;
  // Resolved through a storage pointer whose expected word is
  // `pointer_value`; any persisted write to that slot invalidates, including
  // a write back to the same value.
  BINDING_KIND_STORAGE_POINTER = 2;
  // Declared by parameters only; no on-chain check from block data.
  BINDING_KIND_DECLARED = 3;
}

// Integer rounding direction of a bound conversion.
enum Rounding {
  ROUNDING_UNSPECIFIED = 0;
  ROUNDING_FLOOR = 1;
  ROUNDING_CEIL = 2;
  ROUNDING_HALF_UP = 3;
}

// Kind of same-balance alias.
enum AliasKind {
  ALIAS_KIND_UNSPECIFIED = 0;
  // `asset` exposes the SAME balance as `alias_of` at another precision:
  // asset_amount = round(alias_of_amount * asset_scale / alias_of_scale).
  // Arc: ERC-20 USDC 0x3600...0000 (6 decimals) over native USDC (18).
  ALIAS_KIND_PRECISION_VIEW = 1;
}

// Protocol-specific global state fields. Numeric ranges are reserved per
// family; values are append-only and never renumbered.
enum StateField {
  STATE_FIELD_UNSPECIFIED = 0;

  // Aave V3 `DataTypes.ReserveData` in Pool storage, `key` = underlying
  // asset. Indices and rates are ray (scale 1e27); timestamps are seconds.
  STATE_FIELD_AAVE_LIQUIDITY_INDEX = 1;
  STATE_FIELD_AAVE_CURRENT_LIQUIDITY_RATE = 2;
  STATE_FIELD_AAVE_LAST_UPDATE_TIMESTAMP = 3;
  STATE_FIELD_AAVE_VARIABLE_BORROW_INDEX = 4;
  STATE_FIELD_AAVE_CURRENT_VARIABLE_BORROW_RATE = 5;
  // Packed reserve configuration word (active/paused/frozen bits); gates
  // withdrawability, not conversion.
  STATE_FIELD_AAVE_RESERVE_CONFIGURATION = 6;
  // aToken `_totalSupply` in scaled units (`key` = aToken).
  STATE_FIELD_AAVE_SCALED_TOTAL_SUPPLY = 7;

  // Compound v2 `CTokenStorage` and the cross-contract cash input.
  // Mantissas are 1e18-scaled; block numbers and totals are scale 1.
  // TOTAL_CASH is read from the cash source (underlying ERC-20 balance of the
  // cToken, the market's native balance, or Pot pie x chi); `key` = cToken.
  STATE_FIELD_COMPOUND_V2_TOTAL_CASH = 10;
  STATE_FIELD_COMPOUND_V2_TOTAL_BORROWS = 11;
  STATE_FIELD_COMPOUND_V2_TOTAL_RESERVES = 12;
  STATE_FIELD_COMPOUND_V2_TOTAL_SUPPLY = 13;
  STATE_FIELD_COMPOUND_V2_BORROW_INDEX = 14;
  STATE_FIELD_COMPOUND_V2_ACCRUAL_BLOCK_NUMBER = 15;
  STATE_FIELD_COMPOUND_V2_RESERVE_FACTOR_MANTISSA = 16;
  STATE_FIELD_COMPOUND_V2_INITIAL_EXCHANGE_RATE_MANTISSA = 17;
  // Rate-model contract identity as a 20-byte value in `value` (decimal of
  // the address) is not used; the identity is a Dependency edge. These are
  // the model's storage parameters.
  STATE_FIELD_COMPOUND_V2_IRM_BASE_RATE_PER_BLOCK = 20;
  STATE_FIELD_COMPOUND_V2_IRM_MULTIPLIER_PER_BLOCK = 21;
  STATE_FIELD_COMPOUND_V2_IRM_JUMP_MULTIPLIER_PER_BLOCK = 22;
  STATE_FIELD_COMPOUND_V2_IRM_KINK = 23;
  STATE_FIELD_COMPOUND_V2_IRM_BLOCKS_PER_YEAR = 24;
  // The 2019 WhitePaperInterestRateModel (cETH's Base0bps_Slope2000bps)
  // stores per-year parameters and divides the annual rate by
  // `blocksPerYear` on every call; 1e18-scaled.
  STATE_FIELD_COMPOUND_V2_IRM_BASE_RATE_PER_YEAR = 25;
  STATE_FIELD_COMPOUND_V2_IRM_MULTIPLIER_PER_YEAR = 26;

  // Compound III `CometStorage` packed market state plus implementation
  // immutables and constants. Indices scale 1e15 (BASE_INDEX_SCALE); rates
  // and kinks are 1e18 factors per second; totals are base-token raw units.
  STATE_FIELD_COMET_BASE_SUPPLY_INDEX = 30;
  STATE_FIELD_COMET_BASE_BORROW_INDEX = 31;
  STATE_FIELD_COMET_TOTAL_SUPPLY_BASE = 32;
  STATE_FIELD_COMET_TOTAL_BORROW_BASE = 33;
  STATE_FIELD_COMET_LAST_ACCRUAL_TIME = 34;
  STATE_FIELD_COMET_PAUSE_FLAGS = 35;
  STATE_FIELD_COMET_SUPPLY_KINK = 40;
  STATE_FIELD_COMET_SUPPLY_RATE_SLOPE_LOW = 41;
  STATE_FIELD_COMET_SUPPLY_RATE_SLOPE_HIGH = 42;
  STATE_FIELD_COMET_SUPPLY_RATE_BASE = 43;
  STATE_FIELD_COMET_BORROW_KINK = 44;
  STATE_FIELD_COMET_BORROW_RATE_SLOPE_LOW = 45;
  STATE_FIELD_COMET_BORROW_RATE_SLOPE_HIGH = 46;
  STATE_FIELD_COMET_BORROW_RATE_BASE = 47;
  STATE_FIELD_COMET_BASE_SCALE = 48;
  STATE_FIELD_COMET_BASE_INDEX_SCALE = 49;
  STATE_FIELD_COMET_FACTOR_SCALE = 50;

  // Lido unstructured storage. Shares and ether are raw wei-scale integers.
  // Slots differ per contract version; each row cites the slot it read.
  STATE_FIELD_LIDO_TOTAL_SHARES = 60;
  STATE_FIELD_LIDO_EXTERNAL_SHARES = 61;
  STATE_FIELD_LIDO_BUFFERED_ETHER = 62;
  STATE_FIELD_LIDO_DEPOSITED_POST_REPORT = 63;
  STATE_FIELD_LIDO_CL_VALIDATORS_BALANCE = 64;
  STATE_FIELD_LIDO_CL_PENDING_BALANCE = 65;
  STATE_FIELD_LIDO_CONTRACT_VERSION = 66;
  // internalEther + externalShares x internalEther / internalShares. Only
  // OBSERVATION_DERIVED, and only when every input was observed in-block.
  STATE_FIELD_LIDO_TOTAL_POOLED_ETHER = 67;
  // `TokenRebased` log fields (OBSERVATION_OBSERVED_LOG): the post-report
  // share rate is postTotalEther / postTotalShares.
  STATE_FIELD_LIDO_REPORT_TIMESTAMP = 68;
  STATE_FIELD_LIDO_REPORT_POST_TOTAL_SHARES = 69;
  STATE_FIELD_LIDO_REPORT_POST_TOTAL_ETHER = 70;
  STATE_FIELD_LIDO_REPORT_SHARES_MINTED_AS_FEES = 71;

  // Maker Pot (dependency of sDAI convertToAssets and of cDAI cash). chi and
  // dsr are ray; rho is seconds; pie is a per-account share (HolderBasis).
  STATE_FIELD_MAKER_POT_CHI = 80;
  STATE_FIELD_MAKER_POT_RHO = 81;
  STATE_FIELD_MAKER_POT_DSR = 82;

  // ERC-4626 generic inputs for OpenZeppelin virtual-offset vaults. Vaults
  // bound to another model reuse that family's fields (static aToken ->
  // AAVE_*, sDAI -> MAKER_POT_*).
  STATE_FIELD_ERC4626_TOTAL_SUPPLY = 90;
  STATE_FIELD_ERC4626_TOTAL_ASSETS = 91;
  STATE_FIELD_ERC4626_DECIMALS_OFFSET = 92;
}

// ---------------------------------------------------------------------------
// Rows
// ---------------------------------------------------------------------------

// Exactly one per delivered block, including blocks with no other rows, so
// time- and height-dependent evaluation has a canonical clock for every
// height and the sink's block markers list every delivered block for this
// package. It is a clock fact, not a publication manifest: sink writes are
// not multi-table transactions; the `*_count` fields let a consumer check
// that every row of the block landed.
message BlockClock {
  // Caller-qualified chain id echoed from parameters; the block carries none
  // and the manifest binds the network.
  uint64 chain_id = 1;
  uint64 number = 2;
  // 32 bytes.
  bytes hash = 3;
  // 32 bytes.
  bytes parent_hash = 4;
  // Header timestamp, seconds. Not strictly increasing on every chain.
  uint64 timestamp = 5;
  // 32 bytes; binds the row to the canonical header.
  bytes state_root = 6;
  // `sf.ethereum.type.v2.Block.ver`; the package accepts 4 and 5 only.
  uint32 producer_version = 7;
  // Semantic revision of this package's emission rules; increments when a
  // new enum value, table or rule is introduced. Wire compatibility is
  // unaffected.
  uint32 spec_revision = 8;
  // Producing package name and version, e.g. "aave_balance_state", "v0.1.0".
  string package = 9;
  string package_version = 10;
  // SHA-256 of the exact `map_events` parameters, hex without prefix.
  string parameters_sha256 = 11;
  // Row counts of this block in the other tables.
  uint32 epoch_count = 12;
  uint32 dependency_count = 13;
  uint32 alias_count = 14;
  uint32 holder_basis_count = 15;
  uint32 global_state_count = 16;
}

// Model epoch lifecycle for one market.
// Sort: (market, epoch, ordinal, kind).
message ModelEpoch {
  uint64 chain_id = 1;
  // Token or market whose holder basis this epoch decodes (aToken proxy,
  // cToken, Comet proxy, stETH proxy, vault).
  bytes market = 2;
  // Caller-assigned sequence per (chain, market), starting at 1, strictly
  // increasing with activation. Holder and global rows join on it.
  uint32 epoch = 3;
  EpochEventKind kind = 4;
  ModelFamily family = 5;
  // Stable formula identifier, e.g. "aave-v3/atoken/scaled-floor",
  // "aave-v3/atoken/scaled-half-up", "compound-v2/ctoken/exchange-rate",
  // "comet/base-supply-index", "lido/steth/shares-v4",
  // "erc4626/static-atoken-lm/normalized-income", "erc4626/sdai/pot-rpow".
  string model_id = 6;
  // Source revision the model follows, e.g.
  // "aave-dao/aave-v3-origin@8305565ae342f1773c42cd2e4593f175fe5968a0".
  string source_pin = 7;
  // Protocol-declared revision (Aave ATOKEN_REVISION "5", Lido contract
  // version "4"); "" when none.
  string implementation_revision = 8;
  BasisKind basis_kind = 9;
  // Denominator constant of the basis -> balance conversion as a decimal
  // ("1000000000000000000000000000" for ray, "1000000000000000" for Comet,
  // "" for share ratios).
  string basis_scale = 10;
  // Rounding of the basis -> observable balance conversion.
  Rounding balance_rounding = 11;
  // Bit range of the holder word that holds the basis (Aave 0/120 since
  // v3.4, 0/128 before; Comet 0/104 signed; plain words 0/256).
  uint32 basis_bit_offset = 12;
  uint32 basis_bit_width = 13;
  bool basis_signed = 14;
  // Identity bound for this epoch.
  bytes market_code_hash = 15;
  // "" when `market` is not a proxy.
  bytes implementation = 16;
  bytes implementation_code_hash = 17;
  // Pointer slot on `market`; "" when none.
  bytes implementation_slot = 18;
  // First block (inclusive) and ordinal at which the epoch applies. Writes in
  // the activation block with a smaller ordinal belong to the previous epoch.
  uint64 activation_block = 19;
  uint64 activation_ordinal = 20;
  // Asset the evaluated balance is denominated in and its decimals: the
  // underlying for aToken/cToken/vault, the base token for Comet, the market
  // itself for stETH.
  bytes balance_asset = 21;
  uint32 balance_decimals = 22;
  // BOUND rows: true when holder basis words retained under the previous
  // epoch stay evaluable under this one (same slot, bit range and meaning),
  // e.g. Aave aToken revision 4 -> 5 where only rounding changed.
  bool basis_carryover = 23;
  // Same statement for retained GlobalState rows; false at a storage
  // migration or rate-model replacement.
  bool global_carryover = 24;
  // INVALIDATED / SUSPENDED rows: why, and the persisted evidence in this
  // block, verified by the map.
  InvalidationReason reason = 25;
  Scope scope = 26;
  uint64 ordinal = 27;
  uint32 transaction_index = 28;
  bytes transaction_hash = 29;
  uint32 call_index = 30;
  // Contract written or whose code changed.
  bytes evidence_contract = 31;
  // Pointer or version slot; "" for a code change.
  bytes evidence_slot = 32;
  bytes evidence_previous_word = 33;
  bytes evidence_word = 34;
  // New runtime code hash on a code change.
  bytes evidence_code_hash = 35;
}

// One dependency edge of a bound epoch, emitted with every BOUND and
// REAFFIRMED ModelEpoch. The evaluation graph is recovered by following
// `parent` from `market`.
// Sort: (market, epoch, depth, role, contract).
message Dependency {
  uint64 chain_id = 1;
  bytes market = 2;
  uint32 epoch = 3;
  // BOUND or REAFFIRMED.
  EpochEventKind kind = 4;
  DependencyRole role = 5;
  bytes contract = 6;
  // "" for a direct dependency of `market`; otherwise the `contract` of the
  // edge this one hangs from (token -> pool -> rate model).
  bytes parent = 7;
  // 1 for direct edges.
  uint32 depth = 8;
  BindingKind binding = 9;
  // Pinned runtime code hash; "" when not pinned.
  bytes code_hash = 10;
  // STORAGE_POINTER: contract holding the slot, the slot, the expected word.
  bytes pointer_contract = 11;
  bytes pointer_slot = 12;
  bytes pointer_value = 13;
  uint64 activation_block = 14;
  // Where the identity was read (registry@commit).
  string source_pin = 15;
}

// Same-balance alias declaration, emitted with BOUND/REAFFIRMED cadence by the
// package that owns the alias. No holder rows are synthesized for the alias
// side; consumers evaluate the alias view from the primary side's rows
// (`native/balances` for Arc) with the scales below. Rows sharing
// (asset, alias_of) are views of ONE balance and must never be summed.
// Sort: (asset, alias_of).
message AssetAlias {
  uint64 chain_id = 1;
  AliasKind kind = 2;
  // BOUND or REAFFIRMED.
  EpochEventKind event_kind = 3;
  // The alias side (Arc: ERC-20 interface 0x3600...0000).
  bytes asset = 4;
  // The primary, full-precision side; "" = the chain's native asset.
  bytes alias_of = 5;
  // 10^decimals of each side as decimals ("1000000", "1000000000000000000").
  string asset_scale = 6;
  string alias_of_scale = 7;
  // Rounding of alias_of -> asset (Arc: FLOOR; sub-unit amounts exist only on
  // the primary side).
  Rounding asset_rounding = 8;
  // Emitter of ERC-20-style Transfer logs for primary-side movements (Arc:
  // the system address 0xffff...fffe); "" when none. Recorded so transfer
  // evidence is attributed once.
  bytes log_emitter = 9;
  uint64 activation_block = 10;
  string source_pin = 11;
}

// Holder basis fact.
// Sort: (market, holder, ordinal, boundary).
//
// A row is emitted only for a holder whose basis word was written in this
// block. A holder without a row is missing/uninitialized; "0" is a known
// zero. A shared index update (GlobalState) changes every initialized
// holder's `balanceOf` without any holder row: consumers retain the last
// basis per (market, holder) and the last global state per (market, field,
// key), and evaluate at a selected canonical block with that block's
// BlockClock and the epoch's formula.
message HolderBasis {
  uint64 chain_id = 1;
  bytes market = 2;
  bytes holder = 3;
  // Joins ModelEpoch / Dependency.
  uint32 epoch = 4;
  BasisKind basis_kind = 5;
  // Exact decimal integer. Negative only for SIGNED_PRINCIPAL.
  string value = 6;
  // Decoded value before the first reduced write; "" when no prior word
  // exists in the observation.
  string previous_value = 7;
  Observation observation = 8;
  Boundary boundary = 9;
  Scope scope = 10;
  // Last reduced write, execution ordinal (producer versions 4 and 5 only).
  uint64 ordinal = 11;
  uint64 first_ordinal = 12;
  // Writes reduced into this row.
  uint32 change_count = 13;
  uint32 transaction_index = 14;
  // "" outside TRANSACTION scope.
  bytes transaction_hash = 15;
  uint32 call_index = 16;
  // Provenance of the word: contract whose storage holds it (== market unless
  // delegated), 32-byte slot, raw words as persisted before the first and
  // after the last write, and the decoded bit range.
  bytes storage_contract = 17;
  bytes storage_slot = 18;
  bytes raw_previous_word = 19;
  bytes raw_word = 20;
  uint32 bit_offset = 21;
  uint32 bit_width = 22;
  // Two's complement within [bit_offset, bit_offset + bit_width).
  bool signed = 23;
}

// Shared global state fact consumed by `market`'s bound model.
// Sort: (market, field, key, ordinal, boundary).
//
// One row states ONE field. One persisted write to a packed slot yields one
// row per decoded field (same slot and raw words, different bit ranges). A
// set of rows for a market in one block is whatever that block wrote, never a
// market snapshot: a consumer carries forward each field's own last
// observation and treats an empty `value` as not carried. When two markets
// consume the same write (sDAI and cDAI both read Pot.chi) one row per market
// is emitted; `storage_contract` and `storage_slot` identify the single fact.
message GlobalState {
  uint64 chain_id = 1;
  bytes market = 2;
  uint32 epoch = 3;
  StateField field = 4;
  // Mapping key when the field is a mapping entry (Aave: the underlying
  // asset; COMPOUND_V2_TOTAL_CASH: the cToken as holder in the underlying);
  // "" for scalar fields.
  bytes key = 5;
  // Exact decimal integer; "" means not carried, "0" is an observed zero.
  string value = 6;
  string previous_value = 7;
  // Fixed-point denominator of `value` as a decimal ("1", "1000000000000000",
  // "1000000000000000000", "1000000000000000000000000000").
  string scale = 8;
  Observation observation = 9;
  Boundary boundary = 10;
  Scope scope = 11;
  uint64 ordinal = 12;
  uint64 first_ordinal = 13;
  uint32 change_count = 14;
  uint32 transaction_index = 15;
  bytes transaction_hash = 16;
  uint32 call_index = 17;
  // Meaningful for OBSERVATION_OBSERVED_LOG.
  uint32 log_index = 18;
  // Provenance. For QUALIFIED_CONSTANT rows `storage_contract` is the
  // implementation whose code hash binds the value; slot and words are "".
  bytes storage_contract = 19;
  bytes storage_slot = 20;
  bytes raw_previous_word = 21;
  bytes raw_word = 22;
  uint32 bit_offset = 23;
  uint32 bit_width = 24;
  bool signed = 25;
}
