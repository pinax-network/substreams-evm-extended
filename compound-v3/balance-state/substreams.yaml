specVersion: v0.1.0
package:
  name: compound_v3_balance_state
  version: v0.1.0
  url: https://github.com/pinax-network/substreams-evm-extended
  description: RPC-free Compound III signed principal and market accrual state for explicitly qualified Comet epochs.
protobuf:
  files: [balance_state.proto]
  importPaths: [../../proto/v1]
binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/compound_v3_balance_state.wasm
modules:
  - name: map_events
    kind: map
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:evm.balance_state.v1.Events
params:
  # No market is bound by default. Comet is deployed on Ethereum, Base and
  # other rollups, not on BSC; the manifest network must match the binding.
  map_events: '{"chain_id":1,"producer_versions":[5],"markets":[]}'
network: mainnet
