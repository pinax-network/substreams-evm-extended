name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup >= 1.28 installs the toolchain, components and targets that
      # rust-toolchain.toml pins, so CI and local builds share one pin.
      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustc -vV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Offline regression tests
        run: cargo test --locked --workspace --lib --bins --tests
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Host builds never compile the `#[cfg(target_arch = "wasm32")]` handlers.
      - name: Clippy (wasm32)
        run: cargo clippy --locked --workspace --target wasm32-unknown-unknown -- -D warnings
      - name: WASM check
        run: cargo check --locked --workspace --target wasm32-unknown-unknown
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --no-deps --workspace
          cargo doc --locked --no-deps --workspace --target wasm32-unknown-unknown

  # The committed spkgs of the deployable packages must carry the module hashes
  # of their source, built here on Linux through the package Makefiles.
  packages:
    name: Package hashes
    runs-on: ubuntu-latest
    env:
      # The CLI behind the recorded module hashes; v1.23.0 computes the same.
      SUBSTREAMS_VERSION: v1.22.0
      SUBSTREAMS_SHA256: 6eef6182d8d9e3c0147a3d03f38fc2b9c0f96900d040132294a0b540e691ae67
      # make -C evm-balances schema: upstream's six SQL files, concatenated.
      SCHEMA_SHA256: ed1c3bff14ca0464a029bf753923557cb8b05a6296fbb63e26e3d00456db10ce
      PACKAGES: native/balances erc20/balances evm-balances
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustc -vV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: substreams CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/substreams.tar.gz" \
            "https://github.com/streamingfast/substreams/releases/download/$SUBSTREAMS_VERSION/substreams_linux_x86_64.tar.gz"
          echo "$SUBSTREAMS_SHA256  $RUNNER_TEMP/substreams.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/substreams.tar.gz" -C "$RUNNER_TEMP" substreams
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build
        run: |
          make -C native/balances build
          make -C erc20/balances build
          make -C evm-balances build schema
      - name: Pack
        run: |
          substreams --version
          mkdir dist
          for p in $PACKAGES; do substreams pack "$p/substreams.yaml" -o "dist/{spkgDefaultName}"; done
          cp target/wasm32-unknown-unknown/release/{native_balances,erc20_balances,evm_balances}.wasm dist/
          (cd dist && sha256sum *.wasm > WASM.sha256)
      - name: Summary
        run: |
          {
            echo "### Package hashes ($(rustc -V), substreams $SUBSTREAMS_VERSION)"
            echo
            echo '| Package | Module | Hash |'
            echo '| --- | --- | --- |'
            for p in $PACKAGES; do
              substreams info "$p/substreams.yaml" | awk -v p="$p" '/^Name:/ {n = $2} /^Hash:/ {print "| " p " | " n " | `" $2 "` |"}'
            done
            echo
            echo '| WASM | sha256 |'
            echo '| --- | --- |'
            awk '{print "| " $2 " | `" $1 "` |"}' dist/WASM.sha256
            echo
            echo "\`evm-balances/clickhouse/schema.sql\`: \`$(sha256sum evm-balances/clickhouse/schema.sql | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # Uploaded even when a check below fails: a PR that changes a package
      # takes its committed spkg from here.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: packages
          path: dist/
          if-no-files-found: error
      # wabt's default features are the WASM 2.0 core set, which wasmtime and
      # wazero both run: no tail calls, exceptions, threads, GC or memory64.
      - name: WASM features
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wabt > /dev/null
          for w in dist/*.wasm; do wasm-validate "$w"; done
      - name: Committed packages match the source
        run: |
          hashes() { substreams info "$1" | awk '/^Name:/ {n = $2} /^Hash:/ {print n, $2}'; }
          echo "$SCHEMA_SHA256  evm-balances/clickhouse/schema.sql" | sha256sum -c -
          fail=0
          for p in $PACKAGES; do
            name=$(awk '$1 == "name:" {print $2; exit}' "$p/substreams.yaml")
            version=$(awk '$1 == "version:" {print $2; exit}' "$p/substreams.yaml")
            spkg="spkg/${name//_/-}-$version.spkg"
            if diff <(hashes "$p/substreams.yaml") <(hashes "$spkg"); then
              echo "$spkg matches $p"
            else
              echo "::error::$spkg does not carry the module hashes of $p: repack it from this job's artifact"
              fail=1
            fi
            if [ "$p" = evm-balances ]; then
              schema=$(mktemp -d)
              substreams info "$spkg" --output-sinkconfig-files-path "$schema" > /dev/null
              cmp "$schema/schema" evm-balances/clickhouse/schema.sql || { echo "::error::$spkg embeds another schema"; fail=1; }
            fi
          done
          exit $fail
