name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup >= 1.28 installs the toolchain, components and targets that
      # rust-toolchain.toml pins, so CI and local builds share one pin.
      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustc -vV
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Offline regression tests
        run: cargo test --locked --workspace --lib --bins --tests
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: WASM check
        run: cargo check --locked --workspace --target wasm32-unknown-unknown
