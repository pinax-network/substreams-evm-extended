[package]
name = "native-balances"
description = "RPC-free native account balances from persisted Extended block state, with the shared balances protobuf"
edition = { workspace = true }
version = "0.2.0"
license = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = { workspace = true }
substreams-ethereum = { workspace = true }
proto = { path = "../../proto" }
evm-persist = { path = "../../common/persist" }

[dev-dependencies]
serde_json = "1"
hex = "0.4"
buffa = { workspace = true }
buffa-types = { workspace = true }
