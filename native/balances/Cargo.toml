[package]
name = "native-balances"
description = "RPC-free native account balances from persisted Extended block state, with the shared balances protobuf"
edition = { workspace = true }
version = "0.1.0"
license = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = { workspace = true }
substreams-ethereum = { workspace = true }
proto = { path = "../../proto" }
evm-persist = { path = "../../common/persist" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hex = "0.4"
prost = { workspace = true }
prost-types = { workspace = true }
