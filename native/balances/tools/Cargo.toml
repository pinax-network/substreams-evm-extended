[package]
name = "native-balances-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Offline replay and live same-block parity for the native balance map"

# Host tools are intentionally empty on WASM; the workspace also checks every
# member for wasm32-unknown-unknown. None of these dependencies enter ingestion.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
native-balances = { path = ".." }
evm-persist = { path = "../../../common/persist" }
evm-retention = { path = "../../../common/retention" }
proto = { path = "../../../proto" }
prost = { workspace = true }
substreams-ethereum = { workspace = true }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
erc20-balances = { path = "../../../erc20/balances" }
substreams = { workspace = true }
