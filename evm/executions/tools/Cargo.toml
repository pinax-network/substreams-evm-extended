[package]
name = "evm-executions-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Offline replay of the RPC-free execution-facts map over captured Extended blocks"

# Host tools are intentionally empty on WASM; the workspace also checks every
# member for wasm32-unknown-unknown. None of these dependencies enter ingestion.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
evm-executions = { path = ".." }
proto = { path = "../../../proto" }
prost = { workspace = true }
substreams-ethereum = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
