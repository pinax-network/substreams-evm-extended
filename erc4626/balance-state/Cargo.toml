[package]
name = "erc4626-balance-state"
description = "RPC-free ERC-4626 vault shares and source-bound conversion inputs from Extended blocks (evm.balance_state.v1)"
edition = { workspace = true }
version = "0.1.0"
license = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = { workspace = true }
substreams-ethereum = { workspace = true }
proto = { path = "../../proto" }
evm-persist = { path = "../../common/persist" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
tiny-keccak = { version = "2.0", features = ["keccak"] }

[dev-dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
# Host-only: tests feed emitted rows into the reference conversion models.
conformance = { path = "../../conformance" }
num-bigint = "0.4"
