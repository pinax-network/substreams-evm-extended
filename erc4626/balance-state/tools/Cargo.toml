[package]
name = "erc4626-balance-state-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Live same-block getter parity for the ERC-4626 balance-state map"

# Host tools are intentionally empty on WASM.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
num-bigint = "0.4"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
erc4626-balance-state = { path = ".." }
conformance = { path = "../../../conformance" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
